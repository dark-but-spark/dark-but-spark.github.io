<style>
  body {
    font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    height: 100vh;
    background-color: #fafafa;
  }

  .game-container {
    width: 320px;
    height: 320px;
    border: 1px solid #ccc;
    overflow: hidden;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 5px;
  }

  .rankLabel {
    width: 77px;
    height: 77px;
    background-color: #f4f4f4;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.5em;
    color: #000;
  }

  .score-container {
    width: 320px;
    display: flex;
    justify-content: space-between;
    margin-bottom: 15px;
  }

  .rankLabel[data-value="2"] {
    background-color: pink;
  }

  .rankLabel[data-value="4"] {
    background-color: lightblue;
  }

  .rankLabel[data-value="8"] {
    background-color: lightgreen;
  }

  .rankLabel[data-value="16"] {
    background-color: lightcoral;
  }

  .rankLabel[data-value="32"] {
    background-color: lightsalmon;
  }

  .rankLabel[data-value="64"] {
    background-color: lightseagreen;
  }

  .rankLabel[data-value="128"] {
    background-color: lightgoldenrodyellow;
  }

  .rankLabel[data-value="256"] {
    background-color: lightsteelblue;
  }

  .rankLabel[data-value="512"] {
    background-color: lightpink;
  }

  .rankLabel[data-value="1024"] {
    background-color: lightcyan;
  }

  .rankLabel[data-value="2048"] {
    background-color: lightyellow;
  }

  #restart-btn {
    margin-top: 15px;
    padding: 10px 15px;
    background-color: #f4f4f4;
    border: none;
    cursor: pointer;
    transition: all 0.3s ease;
  }

  #game-over {
    position: absolute;
    top: 50%;
    left: 50%;
    padding: 20px;
    transform: translate();
    background-color: rgba(0, 0, 0, 0.8);
    color: #fff;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;

  }
</style>
<h1>2048</h1>

<h1>2048</h1>
<div class="score-container">
  <div> Score : <span id="current-score">0</span></div>
  <div> High Score : <span id="high-score">0</span></div>
</div>

<div class="game-container">
  <div class="grid">
      <div class="cell" data-row="0" data-col="0"></div>
      <div class="cell" data-row="0" data-col="1"></div>
      <div class="cell" data-row="0" data-col="2"></div>
      <div class="cell" data-row="0" data-col="3"></div>
      <div class="cell" data-row="1" data-col="0"></div>
      <div class="cell" data-row="1" data-col="1"></div>
      <div class="cell" data-row="1" data-col="2"></div>
      <div class="cell" data-row="1" data-col="3"></div>
      <div class="cell" data-row="2" data-col="0"></div>
      <div class="cell" data-row="2" data-col="1"></div>
      <div class="cell" data-row="2" data-col="2"></div>
      <div class="cell" data-row="2" data-col="3"></div>
      <div class="cell" data-row="3" data-col="0"></div>
      <div class="cell" data-row="3" data-col="1"></div>
      <div class="cell" data-row="3" data-col="2"></div>
      <div class="cell" data-row="3" data-col="3"></div>
  </div>
</div>

<div id="game-over">
  逊！！！
  <button id="restart-btn">Restart</button>

</div>

<script>
document.addEventListener('DOMContentLoaded',()=>{
        const grid=document.querySelector('.grid');
        const size=4;
        let board=[];
        let cnt=0;
        const cntElem= document.getElementById("current-score");
    
        let mx= localStorage.getItem("2048-highScore")|| 0;
        const mxElem=document.getElementById("high-score");
        mxElem.textContent=mx;
    
        const GGElem= document.getElementById("game-over");
    
        function update(value)
            {
            cnt+=value;
            cntElem.textContent=cnt;
            if(cnt>mx)
                    {
                mx=cnt;
                mxElem.textContent= mx;
                localStorage.setItem('2048-highScore',mx);
            }
        }
    
        function restart() {
            cnt = 0;
            cntElem.textContent = "0";
            GGElem.style.display = 'none';
            init();
        }
    
        function init() {
            board = [...Array(size)].map(e => Array(size).fill(0));
            place();
            place();
            render();
        }
        //
        function render() {
            for (let i = 0; i < size; i++) {
                for (let j = 0; j < size; j++) {
                    const cell = document.querySelector(`[data-row="${i}"][data-col="${j}"]`);
                    const preValue = cell.dataset.value;
                    const cntValue = board[i][j];
                    if (cntValue != 0) {
                        cell.dataset.value = cntValue;
                        cell.textContent = cntValue;
                        if (cntValue != parseInt(preValue) && !cell.classList.contains("new-tile")) {
                            cell.classList.add("merged-tile");
                        }
                    } else {
                            cell.textContent = '';
                            delete cell.dataset.value;
                            cell.classList.remove("merged-tile", 'new-tile');
                    }
                }
            }
            setTimeout(() => {
                const cells = document.querySelectorAll(".rankLabel");
                   cells.forEach(cell => {
                    cell.classList.remove("merged-tile", 'new-tile');
                   });
            }, 300);
        }
        
        function place() {
            const available = [];
            for (let i = 0; i < size; i++)         {
                for (let j = 0; j < size; j++)             {
                    if (board[i][j] === 0)                 {
                        available.push({ x: i, y: j });
                    }
                }
            }
            if (available.length > 0)         {
                const randomCell = available[Math.floor(Math.random() * available.length)];
                board[randomCell.x][randomCell.y] = Math.random() < 0.9 ? 2 : 4;
                const cell = document.querySelector(`[data-row="${randomCell.x}"][data-col="${randomCell.y}"]`);
                cell.classList.add("new-tile");
    
            }
        }
    
        function move(direction)
        {
            let f_change=false;
            if(direction==='ArrowUp'||direction==="ArrowDown")
            {
                for(let j=0;j<size;j++)
                {
                    const column=[...Array(size)].map((_,i)=>board[i][j]);
                    const newColumn=transform(column,direction==="ArrowUp");
                    for(let i=0;i<size;i++)
                    {
                        if(board[i][j]!=newColumn[i])
                        {
                            f_change=true;
                            board[i][j]=newColumn[i];
                        }
                    }
                }
            }
            else if (direction==="ArrowLeft"||direction==="ArrowRight")
            {
                for(let i=0;i<size;i++)
                {
                    const row=board[i];
                    const newRow=transform(row,direction==="ArrowLeft");
                    if(row.join(',')!==newRow.join(','))
                    {
                        f_change=true;
                        board[i]=newRow;
                    }
    
                }
                
            }
            if(f_change)
            {
                place();
                render();
                checkGameOver();
            }
        }
        
        function transform(line,moveTowardStart)
        {
            let newLine=line.filter(cell=>cell!=0);
            if(!moveTowardStart)
            {
                newLine.reverse();
            }
            for(let i=0;i<newLine.length-1;i++)
            {
                if(newLine[i]===newLine[i+1])
                {
                    newLine[i]*=2;
                    update(newLine[i]);
                    newLine.splice(i+1,1);
                }
            }
            while(newLine.length<size)
            {
                newLine.push(0);
            }
            if(!moveTowardStart)
            {
                newLine.reverse();
            }
            return newLine;
        }
    
        function checkGameOver(){
            for(let i=0;i<size;i++){
                for(let j=0;j<size;j++){
                    if(board[i][j]===0){
                        return ;
                    }
                    if(j<size-1 && board[i][j]===board[i][j+1]){ 
                        return ;
                    }
                    if(i<size-1 &&board[i][j]===board[i+1][j]){
                        return ;
                    }
    
                }
            }
            GGElem.style.display='flex';
        }
        document.addEventListener('keydown',(event)=>{
            if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(event.key)){
                move(event.key);
            }
        });
        document.getElementById('restart-btn').addEventListener('click',restart);
        init();
    });
</script>
