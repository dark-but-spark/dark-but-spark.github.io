<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2048 游戏</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 20px;
    }

    .game-wrapper {
      background: rgba(255, 255, 255, 0.95);
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
    }

    .game-title {
      font-size: 3em;
      font-weight: bold;
      color: #776e65;
      text-align: center;
      margin-bottom: 10px;
    }

    .game-instructions {
      color: #776e65;
      text-align: center;
      margin-bottom: 20px;
      font-size: 0.9em;
    }

    .score-container {
      display: flex;
      justify-content: space-between;
      margin-bottom: 20px;
      gap: 15px;
    }

    .score-box {
      background: #bbada0;
      padding: 15px 25px;
      border-radius: 5px;
      color: white;
      text-align: center;
      min-width: 120px;
    }

    .score-label {
      font-size: 0.8em;
      font-weight: bold;
      text-transform: uppercase;
      margin-bottom: 5px;
    }

    .score-value {
      font-size: 1.5em;
      font-weight: bold;
    }

    .game-container {
      width: 320px;
      height: 320px;
      background-color: #bbada0;
      border-radius: 5px;
      padding: 5px;
      position: relative;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 5px;
      height: 100%;
    }

    .cell {
      background-color: rgba(238, 228, 218, 0.35);
      border-radius: 3px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2em;
      font-weight: bold;
      color: #776e65;
      transition: all 0.15s ease-in-out;
    }

    .cell[data-value="2"] { background-color: #eee4da; color: #776e65; }
    .cell[data-value="4"] { background-color: #ede0c8; color: #776e65; }
    .cell[data-value="8"] { background-color: #f2b179; color: #f9f6f2; }
    .cell[data-value="16"] { background-color: #f59563; color: #f9f6f2; }
    .cell[data-value="32"] { background-color: #f67c5f; color: #f9f6f2; }
    .cell[data-value="64"] { background-color: #f65e3b; color: #f9f6f2; }
    .cell[data-value="128"] { background-color: #edcf72; color: #f9f6f2; font-size: 1.8em; }
    .cell[data-value="256"] { background-color: #edcc61; color: #f9f6f2; font-size: 1.8em; }
    .cell[data-value="512"] { background-color: #edc850; color: #f9f6f2; font-size: 1.8em; }
    .cell[data-value="1024"] { background-color: #edc53f; color: #f9f6f2; font-size: 1.5em; }
    .cell[data-value="2048"] {
      background-color: #edc22e;
      color: #f9f6f2;
      font-size: 1.5em;
      box-shadow: 0 0 30px 10px rgba(243, 215, 116, 0.55);
    }

    @keyframes pop {
      0% { transform: scale(0); }
      50% { transform: scale(1.2); }
      100% { transform: scale(1); }
    }

    @keyframes merge {
      0% { transform: scale(1); }
      50% { transform: scale(1.15); }
      100% { transform: scale(1); }
    }

    .new-tile {
      animation: pop 0.2s ease-in-out;
    }

    .merged-tile {
      animation: merge 0.2s ease-in-out;
    }

    .controls {
      margin-top: 20px;
      display: flex;
      justify-content: center;
      gap: 10px;
    }

    .btn {
      padding: 12px 30px;
      background-color: #8f7a66;
      color: #f9f6f2;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
      font-size: 1em;
      transition: all 0.3s ease;
    }

    .btn:hover {
      background-color: #9f8a76;
      transform: translateY(-2px);
    }

    .btn:active {
      transform: translateY(0);
    }

    #game-over {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.7);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .game-over-content {
      background: white;
      padding: 40px;
      border-radius: 15px;
      text-align: center;
      box-shadow: 0 10px 50px rgba(0, 0, 0, 0.5);
    }

    .game-over-content h2 {
      font-size: 2.5em;
      color: #776e65;
      margin-bottom: 20px;
    }

    .game-over-content p {
      font-size: 1.3em;
      color: #776e65;
      margin-bottom: 30px;
    }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #776e65;
      text-decoration: none;
      font-size: 0.9em;
    }

    .back-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="game-wrapper">
    <div class="game-title">2048</div>
    <div class="game-instructions">使用方向键 ↑↓←→ 移动方块，合并相同数字</div>

    <div class="score-container">
      <div class="score-box">
        <div class="score-label">分数</div>
        <div class="score-value" id="current-score">0</div>
      </div>
      <div class="score-box">
        <div class="score-label">最高分</div>
        <div class="score-value" id="high-score">0</div>
      </div>
    </div>

    <div class="game-container">
      <div class="grid" id="grid"></div>
    </div>

    <div class="controls">
      <button class="btn" id="restart-btn">重新开始</button>
    </div>

    <a href="/" class="back-link">← 返回首页</a>
  </div>

  <div id="game-over">
    <div class="game-over-content">
      <h2>游戏结束！</h2>
      <p>最终分数: <span id="final-score">0</span></p>
      <button class="btn" onclick="restartGame()">再来一局</button>
    </div>
  </div>

  <script>
    const GRID_SIZE = 4;
    let board = [];
    let score = 0;
    let highScore = localStorage.getItem('2048-highScore') || 0;

    const gridElement = document.getElementById('grid');
    const scoreElement = document.getElementById('current-score');
    const highScoreElement = document.getElementById('high-score');
    const finalScoreElement = document.getElementById('final-score');
    const gameOverElement = document.getElementById('game-over');

    highScoreElement.textContent = highScore;

    function initGame() {
      board = Array(GRID_SIZE).fill(null).map(() => Array(GRID_SIZE).fill(0));
      score = 0;
      scoreElement.textContent = '0';
      gameOverElement.style.display = 'none';

      // Create grid cells
      gridElement.innerHTML = '';
      for (let i = 0; i < GRID_SIZE; i++) {
        for (let j = 0; j < GRID_SIZE; j++) {
          const cell = document.createElement('div');
          cell.className = 'cell';
          cell.dataset.row = i;
          cell.dataset.col = j;
          gridElement.appendChild(cell);
        }
      }

      addRandomTile();
      addRandomTile();
      renderBoard();
    }

    function addRandomTile() {
      const emptyCells = [];
      for (let i = 0; i < GRID_SIZE; i++) {
        for (let j = 0; j < GRID_SIZE; j++) {
          if (board[i][j] === 0) {
            emptyCells.push({ row: i, col: j });
          }
        }
      }

      if (emptyCells.length > 0) {
        const randomCell = emptyCells[Math.floor(Math.random() * emptyCells.length)];
        board[randomCell.row][randomCell.col] = Math.random() < 0.9 ? 2 : 4;

        const cell = document.querySelector(`.cell[data-row="${randomCell.row}"][data-col="${randomCell.col}"]`);
        cell.classList.add('new-tile');
      }
    }

    function renderBoard() {
      for (let i = 0; i < GRID_SIZE; i++) {
        for (let j = 0; j < GRID_SIZE; j++) {
          const cell = document.querySelector(`.cell[data-row="${i}"][data-col="${j}"]`);
          const value = board[i][j];

          if (value !== 0) {
            cell.textContent = value;
            cell.dataset.value = value;
          } else {
            cell.textContent = '';
            delete cell.dataset.value;
          }
        }
      }

      setTimeout(() => {
        document.querySelectorAll('.cell').forEach(cell => {
          cell.classList.remove('new-tile', 'merged-tile');
        });
      }, 200);
    }

    function updateScore(points) {
      score += points;
      scoreElement.textContent = score;

      if (score > highScore) {
        highScore = score;
        highScoreElement.textContent = highScore;
        localStorage.setItem('2048-highScore', highScore);
      }
    }

    function move(direction) {
      let moved = false;
      const newBoard = JSON.parse(JSON.stringify(board));

      if (direction === 'ArrowLeft' || direction === 'ArrowRight') {
        for (let i = 0; i < GRID_SIZE; i++) {
          const result = mergeLine(newBoard[i], direction === 'ArrowLeft');
          if (result.moved) moved = true;
          newBoard[i] = result.line;
        }
      } else {
        for (let j = 0; j < GRID_SIZE; j++) {
          const column = newBoard.map(row => row[j]);
          const result = mergeLine(column, direction === 'ArrowUp');
          if (result.moved) moved = true;
          for (let i = 0; i < GRID_SIZE; i++) {
            newBoard[i][j] = result.line[i];
          }
        }
      }

      if (moved) {
        board = newBoard;
        addRandomTile();
        renderBoard();

        if (isGameOver()) {
          finalScoreElement.textContent = score;
          gameOverElement.style.display = 'flex';
        }
      }
    }

    function mergeLine(line, moveLeft) {
      let moved = false;
      let newLine = line.filter(cell => cell !== 0);

      if (!moveLeft) {
        newLine.reverse();
      }

      for (let i = 0; i < newLine.length - 1; i++) {
        if (newLine[i] === newLine[i + 1]) {
          newLine[i] *= 2;
          updateScore(newLine[i]);
          newLine.splice(i + 1, 1);
          moved = true;
        }
      }

      while (newLine.length < GRID_SIZE) {
        newLine.push(0);
      }

      if (!moveLeft) {
        newLine.reverse();
      }

      if (JSON.stringify(line) !== JSON.stringify(newLine)) {
        moved = true;
      }

      return { line: newLine, moved };
    }

    function isGameOver() {
      for (let i = 0; i < GRID_SIZE; i++) {
        for (let j = 0; j < GRID_SIZE; j++) {
          if (board[i][j] === 0) return false;
          if (j < GRID_SIZE - 1 && board[i][j] === board[i][j + 1]) return false;
          if (i < GRID_SIZE - 1 && board[i][j] === board[i + 1][j]) return false;
        }
      }
      return true;
    }

    function restartGame() {
      initGame();
    }

    document.addEventListener('keydown', (e) => {
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) {
        e.preventDefault();
        move(e.key);
      }
    });

    document.getElementById('restart-btn').addEventListener('click', restartGame);

    // Initialize the game
    initGame();
  </script>
</body>
</html>
